apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: d15
spec:
  selector:
    matchLabels: {app: node-agent}
  template:
    metadata:
      labels: {app: node-agent}
    spec:
      terminationGracePeriodSeconds: 5
      containers:
      - name: agent
        image: busybox:1.36
        command: ["sh", "-c", "echo node=$NODE_NAME; sleep 3600"]
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef: {fieldPath: spec.nodeName}
