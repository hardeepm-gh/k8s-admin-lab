apiVersion: v1
kind: Pod
metadata:
  name: waiter
  namespace: d15
  labels: {app: waiter}
spec:
  terminationGracePeriodSeconds: 5
  initContainers:
  - name: wait-for-gate
    image: busybox:1.36
    command:
    - sh
    - -c
    - |
      until nslookup gate.d15.svc.cluster.local. >/dev/null 2>&1; do
        echo "$(date +%T) waiting for gate"
        sleep 3
      done
      echo "$(date +%T) gate resolved"
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "echo app started at $(date +%T); sleep 3600"]
