apiVersion: v1
kind: Pod
metadata:
  name: waiter
  namespace: d15
  labels: {app: waiter}
spec:
  terminationGracePeriodSeconds: 5
  initContainers:
  - name: wait-for-gate
    image: busybox:1.36
    command:
    - sh
    - -c
    - |
      until wget -q -T 2 -O /dev/null http://gate.d15.svc.cluster.local:8080/ 2>/dev/null || getent hosts gate.d15.svc.cluster.local >/dev/null; do
        echo "$(date +%T) waiting for gate"
        sleep 3
      done
      echo "$(date +%T) gate resolved"
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "echo app started at $(date +%T); sleep 3600"]
---
apiVersion: v1
kind: Service
metadata:
  name: gate
  namespace: d15
spec:
  selector: {app: waiter}
  ports:
  - {port: 8080, targetPort: 8080}
