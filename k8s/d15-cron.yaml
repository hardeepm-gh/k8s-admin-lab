apiVersion: batch/v1
kind: CronJob
metadata:
  name: tick-forbid
  namespace: d15
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          terminationGracePeriodSeconds: 5
          containers:
          - name: c
            image: busybox:1.36
            command: ["sh", "-c", "echo start $(date +%T); sleep 75; echo end $(date +%T)"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tick-allow
  namespace: d15
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          terminationGracePeriodSeconds: 5
          containers:
          - name: c
            image: busybox:1.36
            command: ["sh", "-c", "echo start $(date +%T); sleep 75; echo end $(date +%T)"]
