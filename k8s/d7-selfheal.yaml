apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: d7}
spec:
  replicas: 3
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
      - name: api
        image: app:1
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 3000}]
