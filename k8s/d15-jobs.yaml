apiVersion: batch/v1
kind: Job
metadata:
  name: ok
  namespace: d15
spec:
  completions: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: c
        image: busybox:1.36
        command: ["sh", "-c", "echo hello from $(hostname) at $(date +%T); sleep 3"]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: fail
  namespace: d15
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: c
        image: busybox:1.36
        command: ["sh", "-c", "echo attempt at $(date +%T); exit 1"]
