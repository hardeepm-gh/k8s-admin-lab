services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: mydatabase
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser"]
      interval: 3s
      timeout: 5s
      retries: 10
  app:
    build: ./app
    environment:
      DATABASE_URL: postgres://myuser:${DB_PASSWORD}@db:5432/mydatabase
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  db_data: